name: thu_chi
description: "Đọc thông báo biến động số dư VietinBank iPay và thống kê thu chi (chỉ local, offline)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Local database
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # Formatting
  intl: ^0.20.3

  # Dashboard charts
  fl_chart: ^1.2.0

  # CSV export/import
  csv: ^8.0.0
  file_selector: ^1.1.0
  share_plus: ^13.3.0

  # Utilities
  equatable: ^2.1.0
  uuid: ^4.6.0
  crypto: ^3.0.7 # fingerprint chống trùng lặp giao dịch (Phase 9)

  # Dự phòng cho Phase 11 (đồng bộ note qua Supabase)
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for the local database
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Font pixel/terminal (VT323, giấy phép OFL) dùng cho tiêu đề/nhãn/nút bấm
  # phong cách RPG retro — bundle local, KHÔNG tải qua mạng, giữ đúng nguyên
  # tắc offline-first. Đã kiểm tra: hỗ trợ đầy đủ dấu tiếng Việt (khác với
  # "Press Start 2P" — font pixel phổ biến khác nhưng THIẾU nhóm dấu thanh
  # tiếng Việt như ệ/ị/ố/ữ/ả, gây vỡ chữ nếu dùng cho UI tiếng Việt).
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
